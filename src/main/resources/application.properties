spring.application.name=ShortLinksGenerator

spring.datasource.url=jdbc:postgresql://localhost:5432/shortlinks
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.jdbc.time_zone=UTC


jwt.secret.access=${JWT_ACCESS_SECRET}
jwt.secret.refresh=${JWT_REFRESH_SECRET}

jwt.expiration.access=1200000
jwt.expiration.refresh=2592000000